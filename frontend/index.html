<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Q&A RAG Assistant</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand-box">
      <div class="brand-logo">
        ✨
      </div>
      <div>
        <h5>RAG Studio</h5>
        <span>Document AI Assistant</span>
      </div>
    </div>

    <div class="nav-menu">
      <button type="button" class="nav-item active">
        <span class="nav-icon">💬</span>
        <span>AI Assistant</span>
      </button>

      <button type="button" class="nav-item" id="newChatButton">
        <span class="nav-icon">＋</span>
        <span>New Chat</span>
      </button>
    </div>

    <div class="recent-panel">
      <div class="recent-title">
        <span>Recent Searches</span>
        <button type="button" id="clearRecentButton" title="Clear recent searches">
          🗑
        </button>
      </div>

      <div id="recentSearchList" class="recent-search-list">
        <div class="recent-empty">No recent searches yet.</div>
      </div>
    </div>

    <div class="status-card">
      <div class="status-dot"></div>
      <div>
        <small>System Status</small>
        <strong>Online</strong>
      </div>
    </div>
  </aside>

  <main class="chat-main">

    <section class="chat-panel">

      <header class="chat-header">
        <div class="assistant-avatar">
          🤖
        </div>

        <div class="header-text">
          <h5>AI Research Assistant</h5>
          <span><span class="online-dot-text">●</span> Multi-Agent RAG Active</span>
        </div>
      </header>

      <div class="chat-window" id="answerResult"></div>

      <footer class="chat-input-area">
        <div class="upload-strip" id="uploadStrip">
          <div class="upload-strip-left">
            <span>📄</span>
            <span id="selectedFileText">No document selected</span>
          </div>
          <button type="button" id="uploadButton" class="mini-upload-btn" disabled>
            Upload
          </button>
        </div>

        <div id="askLockHint" class="ask-lock-hint">
          Upload a document to start asking questions.
        </div>

        <div class="chat-input-box">
          <button type="button" id="filePickerButton" class="attach-btn" title="Upload document">
            ＋
          </button>

          <input
            type="file"
            id="documentInput"
            name="document"
            accept=".pdf,.txt,.md"
            hidden
          >

          <textarea
            id="questionInput"
            placeholder="Upload a document first to ask questions..."
            disabled
          ></textarea>

          <button
            type="button"
            id="sendButton"
            class="send-btn"
            title="Send"
            disabled
          >
            ➤
          </button>
        </div>

        <div id="uploadStatus" class="upload-status-box">
          Select a document to begin.
        </div>
      </footer>

    </section>

  </main>

</div>

<script src="app.js"></script>
</body>
</html>
